<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
</head>
<body>
    <main class="container-fluid mt-3">
        <div class="p-md-4">
            <div class="d-flex justify-content-between align-items-center">
                <h3 class="mt-3">Beli Barang</h3>
                <a href="/">Data Produk</a>
            </div>
            <div id="alert"></div>
            <div class="card">
                <div class="card-header">Checkout</div>
                <div class="card-body">
                    <form id="form-beli-barang" class="row align-items-end">
                        <div class="mb-3 col-12 col-md-5"> 
                            <label for="select-produk" class="form-label">Daftar Produk</label>
                            <select type="text" id="select-produk" name="produk" class="form-control" required>
                            </select>
                        </div>
                        <div class="mb-3 col-12 col-md-5"> 
                            <label for="jumlah" class="form-label">Jumlah Beli</label>
                            <input type="number" id="jumlah" name="jumlah" class="form-control" required>
                        </div>
                        <div class="mb-3 col-12 col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Beli</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = "/api/produk";
        const getAllProduct = async() => {
            const selectProduk = document.querySelector('#select-produk');
            const res = await fetch(API);
            const result = await res.json();
            const data = result.data;

            selectProduk.innerHTML = '<option disabled value="0" selected>-- Pilih Produk --</option>';
            data.forEach(item => {
                const optionName = `${item['nama_produk']} | stok: ${item['stok']} | Rp${item['harga']}`;
                const newOption = new Option(optionName, item['id']);
                selectProduk.add(newOption);
            });
        }

        const formBeliBarang = document.querySelector('#form-beli-barang');
        formBeliBarang.addEventListener('submit', async(e) => {
            e.preventDefault();
            const formData = new FormData(formBeliBarang);
            const body = {
                'id_produk': formData.get('produk'),
                'jumlah' : formData.get('jumlah')
            }

            const res = await fetch("/api/checkout", {
                method: "POST", 
                headers: {
                    "Content-Type" : "application/json"
                },
                body: JSON.stringify(body)
            });
            const result = await res.json();

            if(!result.error){
                getAllProduct();
                document.querySelector('#alert').innerHTML = `<div class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Transaksi Berhasil</strong> pembelian produk ${result.data['nama_produk']} sebanyak ${result.data['jumlah_beli']} produk dengan total harga Rp${result.data['jumlah_beli'] * result.data['harga_produk']} (Rp${result.data['harga_produk']}/pcs).
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`
                alert(result.message);
            }else{
                alert(result.message);
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            getAllProduct();
        });
    </script>
</body>
</html>
